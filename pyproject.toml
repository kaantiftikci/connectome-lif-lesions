[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinek"
version = "1.0.0"
description = "Connectome-constrained lesion modelling of the fly brain with an amortised inverse model"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
ai = ["torch>=2.2", "sbi>=0.23"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sinek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
